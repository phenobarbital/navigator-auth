name: Build and publish to PyPI

on:
  release:
    types: [created]
  # Allows a dry run: builds wheels + sdist without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels:
    name: Build wheels (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # cibuildwheel 4.x requires Python >= 3.11 to run; the interpreters it
      # builds against live inside the manylinux containers, not here.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build wheels
        env:
          CIBW_ARCHS: x86_64
          CIBW_BUILD: "cp3{10,11,12,13,14}-*"
          CIBW_SKIP: "*-musllinux_*"
          # Rust and the build deps are installed inside each manylinux container.
          CIBW_BEFORE_BUILD: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal && pip install cython setuptools-rust"
          CIBW_ENVIRONMENT: 'PATH=$HOME/.cargo/bin:$PATH'
        run: |
          uv tool run --from 'cibuildwheel>=4,<5' cibuildwheel --platform linux --output-dir dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/navigator-auth
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.NAVIGATORAUTH_PYPI_API_TOKEN }}
